# Two containers for Codespaces:
#   app  - Python and Node.js, where the code runs
#   db   - PostgreSQL, the database
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database container's network, so the database is at localhost:5432.
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      # Only reachable inside this Codespace, so a simple password is fine here.
      POSTGRES_USER: friendfinder
      POSTGRES_PASSWORD: friendfinder
      POSTGRES_DB: friendfinder

volumes:
  postgres-data:
